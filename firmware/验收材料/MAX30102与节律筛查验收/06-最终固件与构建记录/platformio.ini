[platformio]
src_dir = .
include_dir = src
# Windows 下 Espressif 链接器对中文构建路径兼容性不稳定，故把中间产物
# 放到系统临时目录；源码仍保留在当前工程目录。
build_dir = ${sysenv.TEMP}/smartcane-platformio-build

# GOOUUU ESP32-S3-CAM（8 MB Flash + OPI PSRAM）主工程构建环境。
[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
build_src_filter =
  # Arduino IDE 使用根目录 SmartCane.ino；PlatformIO 只编译 src/main.cpp。
  -<SmartCane.ino>
  +<src/**/*.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DSMARTCANE_PLATFORMIO=1
  # 实测板通过 CH340 暴露 UART0（COM8），不能把 Serial 切到原生 USB CDC。
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
